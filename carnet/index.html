<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet Prensa Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600;1,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --azul: #0b2a7a;
    --azul-osc: #061a52;
    --azul-claro: #1f4fc4;
    --rojo: #e3111b;
    --rojo-osc: #b10a12;
    --gris: #eef2f8;
    --tinta: #0d1b3d;
    --panel: #ffffff;
    --fondo: #dfe3ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Montserrat', Arial, sans-serif;
    background: var(--fondo);
    color: var(--tinta);
  }
  .app { display: flex; gap: 24px; padding: 20px 16px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }

  /* ---------- Panel de edición ---------- */
  .editor {
    width: 360px; max-width: 100%;
    background: var(--panel); border-radius: 14px; padding: 18px;
    box-shadow: 0 6px 24px rgba(0,0,0,.08);
    position: sticky; top: 16px;
  }
  .editor h1 { font-size: 18px; margin: 0 0 4px; }
  .editor p.ayuda { font-size: 12px; margin: 0 0 14px; color: #556; }
  .editor fieldset { border: 1px solid #dde3ee; border-radius: 10px; margin: 0 0 12px; padding: 10px 12px 4px; }
  .editor legend { font-size: 12px; font-weight: 800; color: var(--azul); padding: 0 6px; text-transform: uppercase; letter-spacing: .5px; }
  .editor label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
  .editor input[type=text], .editor textarea {
    width: 100%; margin-top: 3px; padding: 7px 9px; font: inherit; font-weight: 500; font-size: 13px;
    border: 1px solid #c9d2e3; border-radius: 7px; background: #fbfcff;
  }
  .editor textarea { resize: vertical; min-height: 70px; }
  .editor input[type=file] { margin-top: 4px; font-size: 12px; width: 100%; }
  .botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .botones button {
    flex: 1 1 140px; border: 0; border-radius: 8px; padding: 10px; cursor: pointer;
    font: inherit; font-weight: 700; font-size: 13px; color: #fff; background: var(--azul);
  }
  .botones button.rojo { background: var(--rojo); }
  .botones button.gris { background: #6b7590; }

  /* ---------- Carnets ---------- */
  .vista { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .escala { width: 460px; max-width: 100%; }
  .card {
    width: 460px; height: 1040px; position: relative; overflow: hidden;
    border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
    transform-origin: top left;
  }
  .ranura {
    position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    width: 96px; height: 18px; border-radius: 9px; background: #c7ccd6;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.35); z-index: 5;
  }
  .fondo-svg { position: absolute; top: 0; left: 0; width: 460px; height: 1040px; z-index: 0; pointer-events: none; }
  .contenido { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; }

  /* Logo */
  .logo { display: flex; align-items: center; gap: 6px; }
  .logo .marca { width: 128px; height: 108px; flex: none; }
  .logo .marca img { width: 100%; height: 100%; object-fit: contain; }
  .logo .textos { text-align: center; line-height: 1; }
  .logo .nombre { font-weight: 900; font-size: 44px; letter-spacing: -1.5px; }
  .logo .nombre .a { color: var(--rojo); }
  .logo .nombre .b { color: var(--azul); }
  .logo .sub { display: flex; align-items: center; gap: 6px; justify-content: center; font-weight: 800; font-size: 21px; color: var(--azul); margin-top: 3px; }
  .logo .sub::before, .logo .sub::after { content: ""; height: 3px; width: 22px; background: var(--rojo); border-radius: 2px; }
  .logo .sub .r { color: var(--rojo); }
  .lema { font-style: italic; font-weight: 700; text-align: center; font-size: 15px; line-height: 1.25; }

  /* Frente */
  .frente { background: linear-gradient(180deg, #fff 0%, #f3f6fc 55%, #e9eef8 100%); }
  .frente .contenido { padding-top: 76px; }
  .frente .lema { color: var(--azul); margin: -6px 0 0 70px; }
  .foto {
    width: 256px; height: 256px; margin-top: 12px; border-radius: 12px; overflow: hidden;
    border: 4px solid var(--azul); background: #cfd7e6; box-shadow: 0 4px 12px rgba(0,0,0,.2);
    display: flex; align-items: center; justify-content: center; color: #7a86a3; font-weight: 700; font-size: 14px;
  }
  .foto img { width: 100%; height: 100%; object-fit: cover; }
  .banda-nombre {
    margin-top: 10px; width: 404px; padding: 10px 14px 8px; text-align: center;
    color: #fff; font-weight: 900; font-size: 29px; line-height: 1.08; text-transform: uppercase;
    filter: drop-shadow(0 3px 4px rgba(6,26,82,.35));
  }
  .banda-cargo {
    width: 350px; padding: 7px 10px; text-align: center; margin-top: -2px;
    color: #fff; font-weight: 800; font-size: 19px; text-transform: uppercase; position: relative; z-index: 1;
  }
  .datos { width: 400px; margin-top: 12px; }
  .dato { display: flex; align-items: center; gap: 14px; padding: 6px 0; border-bottom: 1.5px solid #c6cfdf; }
  .dato:last-child { border-bottom: 0; }
  .dato .ico { width: 44px; height: 44px; border-radius: 50%; background: var(--azul); flex: none; display: flex; align-items: center; justify-content: center; }
  .dato .ico svg { width: 26px; height: 26px; fill: #fff; }
  .dato .et { font-size: 14px; font-weight: 600; color: var(--tinta); }
  .dato .val { font-size: 19px; font-weight: 600; color: var(--azul-osc); margin-top: 2px; }
  .fila-qr { width: 400px; display: flex; align-items: center; gap: 24px; margin-top: 4px; }
  .qr { width: 110px; height: 110px; background: #fff; padding: 6px; border-radius: 4px; flex: none; }
  .qr img, .qr canvas { width: 100% !important; height: 100% !important; display: block; }
  .codigo { flex: 1; }
  .codigo .et { font-weight: 800; font-size: 17px; margin-left: 6px; }
  .codigo .num {
    margin-top: 4px; background: var(--azul-osc); color: #fff; border-radius: 6px;
    font-weight: 900; font-size: 32px; text-align: center; padding: 4px 0; letter-spacing: 1px;
  }
  .pie-frente {
    margin-top: 10px; width: 410px; padding: 6px 10px; text-align: center; color: #fff; position: relative; z-index: 3;
  }
  .pie-frente .t1 { font-weight: 800; font-size: 19px; }
  .pie-frente .t2 { font-weight: 700; font-size: 13px; letter-spacing: .3px; }

  /* Reverso */
  .reverso { background: radial-gradient(ellipse at 50% 30%, #1d3d9a 0%, #0c2468 45%, #06164a 100%); color: #fff; }
  .reverso .contenido { padding-top: 92px; }
  .reverso .logo .nombre .b, .reverso .logo .sub { color: #fff; }
  .reverso .logo .nombre .a { color: #ff2a33; }
  .reverso .logo .sub .r { color: #ff4a52; }
  .reverso .lema { margin-top: 8px; font-size: 18px; }
  .mision-tit {
    margin-top: 22px; padding: 8px 40px; font-weight: 900; font-size: 21px;
  }
  .mision { margin: 16px 26px 0; text-align: center; font-size: 15.5px; font-weight: 500; line-height: 1.45; white-space: pre-line; }
  .valores { display: flex; justify-content: space-between; width: 410px; margin-top: 24px; }
  .valor { width: 96px; text-align: center; font-size: 13px; font-weight: 700; line-height: 1.2; }
  .valor .circ { width: 76px; height: 76px; margin: 0 auto 10px; border: 2.5px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .valor .circ svg { width: 40px; height: 40px; fill: #fff; }
  .frase { margin-top: 26px; text-align: center; font-style: italic; font-weight: 700; font-size: 25px; line-height: 1.2; transform: rotate(-7deg); }
  .frase .subraya { display: block; height: 4px; width: 270px; margin: 4px auto 0; background: var(--rojo); border-radius: 50%; }
  .fondo-rev { position: absolute; left: 0; right: 0; top: 640px; height: 290px; z-index: 1; background-size: 100% 100%, cover; background-position: center; background-repeat: no-repeat; }
  .redes { position: absolute; bottom: 150px; right: 26px; z-index: 3; text-align: center; }
  .redes .iconos { display: flex; gap: 6px; justify-content: center; }
  .redes .iconos span { width: 34px; height: 34px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; }
  .redes .iconos svg { width: 20px; height: 20px; fill: var(--azul-osc); }
  .redes .n1 { margin-top: 10px; font-weight: 900; font-size: 18px; }
  .redes .n2 { display: flex; align-items: center; gap: 6px; justify-content: center; font-weight: 600; font-size: 15px; }
  .redes .n2::before, .redes .n2::after { content: ""; width: 20px; height: 2px; background: var(--rojo); }

  @media (max-width: 520px) {
    .escala { width: calc(100vw - 32px); }
  }
  @media print {
    @page { margin: 8mm; }
    body { background: #fff; }
    .editor { display: none; }
    .app { padding: 0; }
    .card { box-shadow: none; transform: none !important; }
    .escala { width: 460px !important; height: 1040px !important; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ================= EDITOR ================= -->
  <form class="editor" id="editor" onsubmit="return false">
    <h1>Plantilla de carnet</h1>
    <p class="ayuda">Edita los campos y el carnet se actualiza al instante. Luego descarga el frente y el reverso en PNG o imprímelos.</p>

    <fieldset>
      <legend>Persona</legend>
      <label>Foto <input type="file" accept="image/*" id="inFoto"></label>
      <label>Nombre (línea 1 de la banda) <input type="text" data-k="nombre1" value="JUAN RAFAEL"></label>
      <label>Nombre (línea 2 de la banda) <input type="text" data-k="nombre2" value="CRUZ PÉREZ"></label>
      <label>Nombre completo <input type="text" data-k="nombre" value="Juan Rafael Cruz Pérez"></label>
      <label>Cargo <input type="text" data-k="cargo" value="Periodista y Reportero"></label>
      <label>Afiliación <input type="text" data-k="afiliacion" value="Prensa Digital"></label>
      <label>Código <input type="text" data-k="codigo" value="0007"></label>
      <label>Contenido del QR (enlace o texto) <input type="text" data-k="qr" value="ASOIPREDI - Carnet 0007 - Juan Rafael Cruz Pérez"></label>
    </fieldset>

    <fieldset>
      <legend>Organización</legend>
      <label>Logo (opcional, reemplaza el dibujado) <input type="file" accept="image/*" id="inLogo"></label>
      <label>Nombre parte roja <input type="text" data-k="org1" value="ASOI"></label>
      <label>Nombre parte azul <input type="text" data-k="org2" value="PREDI"></label>
      <label>Subtítulo <input type="text" data-k="sub" value="Prensa Digital"></label>
      <label>Lema <input type="text" data-k="lema" value="Información que conecta con la verdad"></label>
      <label>Pie del frente <input type="text" data-k="pie1" value="PRENSA DIGITAL"></label>
      <label>Valores del pie <input type="text" data-k="pie2" value="VERAZ • OBJETIVA • COMPROMETIDA"></label>
    </fieldset>

    <fieldset>
      <legend>Reverso</legend>
      <label>Título <input type="text" data-k="misionTit" value="NUESTRA MISIÓN"></label>
      <label>Texto de la misión <textarea data-k="mision">Somos una asociación que agrupa a comunicadores digitales comprometidos con la verdad, la ética y el servicio a la sociedad, promoviendo una prensa libre, responsable y al servicio de la gente.</textarea></label>
      <label>Frase <input type="text" data-k="frase" value="La prensa digital también construye país"></label>
      <label>Imagen de fondo propia (opcional, reemplaza la ilustración) <input type="file" accept="image/*" id="inFondo"></label>
    </fieldset>

    <div class="botones">
      <button type="button" id="btnFrente">⬇ PNG frente</button>
      <button type="button" id="btnReverso">⬇ PNG reverso</button>
      <button type="button" class="rojo" id="btnImprimir">🖨 Imprimir</button>
      <button type="button" class="gris" id="btnReset">Restablecer</button>
    </div>
  </form>

  <!-- ================= CARNETS ================= -->
  <div class="vista">

    <!-- FRENTE -->
    <div class="escala"><div class="card frente" id="cardFrente">
      <div class="ranura"></div>
      <svg class="fondo-svg" viewBox="0 0 460 1040" width="460" height="1040" aria-hidden="true">
        <defs>
          <linearGradient id="fBase" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f2f5fb"/><stop offset="1" stop-color="#e4eaf6"/></linearGradient>
          <linearGradient id="fAzul" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a5ad8"/><stop offset=".5" stop-color="#0b2a7a"/><stop offset="1" stop-color="#061a52"/></linearGradient>
          <linearGradient id="fRojo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4048"/><stop offset=".55" stop-color="#e3111b"/><stop offset="1" stop-color="#a50810"/></linearGradient>
          <linearGradient id="fBrillo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <pattern id="fPuntos" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#9fb3dd"/></pattern>
          <pattern id="fTrama" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.15" fill="#b3c3e6"/></pattern>
          <linearGradient id="fFadeMapa" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="470"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".25" stop-color="#fff"/><stop offset=".75" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <mask id="fMascaraMapa"><rect width="460" height="1040" fill="url(#fFadeMapa)"/></mask>
          <radialGradient id="fFadeTrama" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
          <mask id="fMascaraTramaI"><ellipse cx="0" cy="360" rx="120" ry="190" fill="url(#fFadeTrama)"/></mask>
          <mask id="fMascaraTramaD"><ellipse cx="460" cy="190" rx="150" ry="120" fill="url(#fFadeTrama)"/></mask>

<script>
(function () {
  const CLAVE = 'carnet-plantilla-v1';
  const form = document.getElementById('editor');
  const campos = [...form.querySelectorAll('[data-k]')];
  const defaults = Object.fromEntries(campos.map(c => [c.dataset.k, c.value]));
  const imagenes = { foto: null, logo: null, fondo: null };

  // Logo dibujado por defecto (la "A" con periódico y señal)
  const LOGO_SVG = `<svg viewBox="0 0 128 108" width="100%" height="100%">
    <path d="M6 100 L56 8 L78 8 L66 34 L40 100 Z" fill="#0b2a7a"/>
    <path d="M58 64 L72 34 L100 100 L80 100 Z" fill="#1f4fc4"/>
    <rect x="44" y="40" width="34" height="30" rx="2" fill="#fff" stroke="#0b2a7a" stroke-width="2"/>
    <rect x="48" y="44" width="11" height="10" fill="#e3111b"/>
    <rect x="62" y="45" width="12" height="2.4" fill="#0b2a7a"/><rect x="62" y="50" width="12" height="2.4" fill="#0b2a7a"/>
    <rect x="48" y="57" width="26" height="2.4" fill="#0b2a7a"/><rect x="48" y="62" width="26" height="2.4" fill="#0b2a7a"/>
    <path d="M0 86 C40 70 80 66 126 74 C90 74 50 82 14 100 Z" fill="#e3111b"/>
    <path d="M84 22 a10 10 0 0 1 10 10" stroke="#e3111b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M84 12 a20 20 0 0 1 20 20" stroke="#e3111b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M84 2 a30 30 0 0 1 30 30" stroke="#e3111b" stroke-width="4" fill="none" stroke-linecap="round"/>
  </svg>`;

  function datos() { return Object.fromEntries(campos.map(c => [c.dataset.k, c.value])); }

  function pintarSub(el, texto) {
    // Primera palabra en azul/blanco, el resto en rojo (como "Prensa Digital")
    const partes = texto.trim().split(/\s+/);
    el.innerHTML = '';
    const s1 = document.createElement('span'); s1.textContent = partes.shift() || '';
    const s2 = document.createElement('span'); s2.className = 'r'; s2.textContent = partes.length ? ' ' + partes.join(' ') : '';
    el.append(s1, s2);
  }

  // Dibuja la forma inclinada de cada banda como fondo SVG (sale igual en pantalla, PNG e impresión).
  // El SVG lleva el tamaño real de la banda para que html2canvas no lo deforme.
  function pintarFormas() {
    document.querySelectorAll('[data-forma]').forEach(el => {
      const w = el.offsetWidth * 3, h = el.offsetHeight * 3;
      if (!w || !h) return;
      const col = el.dataset.colores.split(',');
      const stops = col.map((c, i) => `<stop offset="${i / (col.length - 1)}" stop-color="${c}"/>`).join('');
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 100 100" preserveAspectRatio="none">` +
        `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">${stops}</linearGradient></defs>` +
        `<polygon points="${el.dataset.forma}" fill="url(#g)"/></svg>`;
      el.style.background = `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}") center / 100% 100% no-repeat`;
    });
  }

  let qr;
  function render() {
    const d = datos();
    document.querySelectorAll('[data-v]').forEach(el => { el.textContent = d[el.dataset.v] ?? ''; });
    document.querySelectorAll('[data-sub]').forEach(el => pintarSub(el, d.sub));
    document.querySelectorAll('[data-logo]').forEach(el => {
      el.innerHTML = imagenes.logo ? `<img alt="" src="${imagenes.logo}">` : LOGO_SVG;
    });
    const foto = document.getElementById('foto');
    foto.innerHTML = imagenes.foto ? `<img alt="Foto" src="${imagenes.foto}">` : 'Sube una foto';
    document.getElementById('fondoRev').style.backgroundImage = imagenes.fondo
      ? `linear-gradient(rgba(12,36,104,1), rgba(12,36,104,.45) 35%, rgba(6,22,74,.45) 70%, rgba(6,22,74,1)), url(${imagenes.fondo})`
      : 'none';
    document.getElementById('escena').style.display = imagenes.fondo ? 'none' : '';

    const qrBox = document.getElementById('qr');
    qrBox.innerHTML = '';
    if (window.QRCode && d.qr) {
      qr = new QRCode(qrBox, { text: d.qr, width: 200, height: 200, colorDark: '#061a52', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    }
    pintarFormas();
    guardar();
  }

  function guardar() {
    try { localStorage.setItem(CLAVE, JSON.stringify({ d: datos(), img: imagenes })); } catch (e) { /* sin espacio o bloqueado */ }
  }
  function cargar() {
    try {
      const g = JSON.parse(localStorage.getItem(CLAVE) || 'null');
      if (!g) return;
      campos.forEach(c => { if (g.d && c.dataset.k in g.d) c.value = g.d[c.dataset.k]; });
      Object.assign(imagenes, g.img || {});
    } catch (e) { /* ignorar */ }
  }

  function leerImagen(input, clave, maxLado) {
    input.addEventListener('change', () => {
      const f = input.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        // Reducir la imagen para que quepa en el almacenamiento del navegador
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, maxLado / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          imagenes[clave] = c.toDataURL(clave === 'logo' ? 'image/png' : 'image/jpeg', .9);
          render();
        };
        img.src = r.result;
      };
      r.readAsDataURL(f);
    });
  }

  async function descargar(id, nombre) {
    if (!window.html2canvas) { alert('No se pudo cargar la herramienta de descarga (revisa tu conexión a internet). Puedes usar "Imprimir" y guardar como PDF.'); return; }
    const card = document.getElementById(id);
    const prev = card.style.transform; card.style.transform = 'none';
    const canvas = await html2canvas(card, { scale: 3, backgroundColor: null, useCORS: true });
    card.style.transform = prev;
    const a = document.createElement('a');
    const cod = (datos().codigo || 'carnet').replace(/[^\w-]+/g, '');
    a.download = `carnet-${cod}-${nombre}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  // Ajustar el carnet al ancho de pantalla en móviles
  function escalar() {
    document.querySelectorAll('.escala').forEach(w => {
      const card = w.querySelector('.card');
      const k = Math.min(1, w.clientWidth / 460);
      card.style.transform = k < 1 ? `scale(${k})` : '';
      w.style.height = (1040 * k) + 'px';
    });
  }

  cargar();
  campos.forEach(c => c.addEventListener('input', render));
  leerImagen(document.getElementById('inFoto'), 'foto', 900);
  leerImagen(document.getElementById('inLogo'), 'logo', 600);
  leerImagen(document.getElementById('inFondo'), 'fondo', 1200);
  document.getElementById('btnFrente').onclick = () => descargar('cardFrente', 'frente');
  document.getElementById('btnReverso').onclick = () => descargar('cardReverso', 'reverso');
  document.getElementById('btnImprimir').onclick = () => window.print();
  document.getElementById('btnReset').onclick = () => {
    if (!confirm('¿Restablecer todos los campos e imágenes?')) return;
    campos.forEach(c => { c.value = defaults[c.dataset.k]; });
    imagenes.foto = imagenes.logo = imagenes.fondo = null;
    form.querySelectorAll('input[type=file]').forEach(i => i.value = '');
    render();
  };
  window.addEventListener('resize', escalar);
  render();
  escalar();
})();
</script>
