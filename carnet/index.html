<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet Prensa Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Roboto:wght@500;700;900&family=Poppins:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --azul: #0b2a7a;
    --azul-osc: #0a1f5c;
    --rojo: #e3111b;
    --tinta: #0d1b3d;
    --panel: #ffffff;
    --fondo: #dfe3ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Montserrat', Arial, sans-serif;
    background: var(--fondo);
    color: var(--tinta);
  }
  .app { display: flex; gap: 24px; padding: 20px 16px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }

  /* ---------- Panel de edición ---------- */
  .editor {
    width: 340px; max-width: 100%;
    background: var(--panel); border-radius: 14px; padding: 18px;
    box-shadow: 0 6px 24px rgba(0,0,0,.08);
    position: sticky; top: 16px;
  }
  .editor h1 { font-size: 18px; margin: 0 0 4px; }
  .editor p.ayuda { font-size: 12px; margin: 0 0 14px; color: #556; }
  .editor fieldset { border: 1px solid #dde3ee; border-radius: 10px; margin: 0 0 12px; padding: 10px 12px 4px; }
  .editor legend { font-size: 12px; font-weight: 800; color: var(--azul); padding: 0 6px; text-transform: uppercase; letter-spacing: .5px; }
  .editor label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
  .editor input[type=text] {
    width: 100%; margin-top: 3px; padding: 7px 9px; font: inherit; font-weight: 500; font-size: 13px;
    border: 1px solid #c9d2e3; border-radius: 7px; background: #fbfcff;
  }
  .editor input[type=file] { margin-top: 4px; font-size: 12px; width: 100%; }
  .botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .botones button {
    flex: 1 1 130px; border: 0; border-radius: 8px; padding: 10px; cursor: pointer;
    font: inherit; font-weight: 700; font-size: 13px; color: #fff; background: var(--azul);
  }
  .botones button.rojo { background: var(--rojo); }
  .botones button.gris { background: #6b7590; }

  /* ---------- Carnets ---------- */
  /* Medidas iguales al área impresa del diseño original (466 × 1075) */
  .vista { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .escala { width: 466px; max-width: 100%; }
  .card {
    width: 466px; height: 1075px; position: relative; overflow: hidden;
    border-radius: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
    transform-origin: top left; background: #fff;
  }
  .card > .fondo { position: absolute; top: 0; left: 0; width: 466px; height: 1075px; display: block; }
  .card > * { position: absolute; }
  .ranura {
    top: 18px; left: 174px; width: 118px; height: 32px; border-radius: 16px;
    background: linear-gradient(#b9bfca, #d3d8e0); box-shadow: inset 0 3px 5px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.7);
  }

  /* Frente: posiciones tomadas del diseño original */
  .foto {
    left: 113px; top: 225px; width: 257px; height: 260px; border-radius: 6px; overflow: hidden;
    background: #d5dceb; display: flex; align-items: center; justify-content: center;
    color: #7a86a3; font-weight: 700; font-size: 14px;
  }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .txt { white-space: nowrap; line-height: 1; transform-origin: center; display: flex; justify-content: center; }
  .nombre1, .nombre2 {
    left: 52px; width: 390px; text-align: center; color: #fff;
    font-family: 'Roboto', Arial, sans-serif; font-weight: 900; font-size: 35px; text-transform: uppercase;
    text-shadow: 0 2px 3px rgba(0,0,0,.35);
  }
  .nombre1 { top: 498px; }
  .nombre2 { top: 530px; }
  .cargo-banda {
    left: 72px; width: 350px; top: 574px; text-align: center; color: #fff;
    font-family: 'Roboto', Arial, sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  .valor {
    left: 111px; width: 325px; color: #0f1f55;
    font-family: 'Roboto', Arial, sans-serif; font-weight: 500; font-size: 23px; transform-origin: left center; justify-content: flex-start;
  }
  .valor.v1 { top: 641px; }
  .valor.v2 { top: 712px; }
  .valor.v3 { top: 781px; }
  .numero {
    left: 190px; width: 199px; top: 864px; text-align: center; color: #fff;
    font-family: 'Poppins', Arial, sans-serif; font-weight: 700; font-size: 35px; letter-spacing: 1px;
  }
  .qr { left: 36px; top: 815px; width: 120px; height: 120px; background: #fff; padding: 4px; }
  .qr img, .qr canvas { width: 100% !important; height: 100% !important; display: block; }

  @media (max-width: 520px) {
    .escala { width: calc(100vw - 32px); }
  }
  @media print {
    @page { margin: 8mm; }
    body { background: #fff; }
    .editor { display: none; }
    .app { padding: 0; }
    .card { box-shadow: none; transform: none !important; }
    .escala { width: 466px !important; height: 1075px !important; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ================= EDITOR ================= -->
  <form class="editor" id="editor" onsubmit="return false">
    <h1>Plantilla de carnet</h1>
    <p class="ayuda">Edita los datos y el carnet se actualiza al instante. Luego descarga el frente y el reverso en PNG o imprímelos.</p>

    <fieldset>
      <legend>Datos del carnet</legend>
      <label>Foto <input type="file" accept="image/*" id="inFoto"></label>
      <label>Nombre en la banda (línea 1) <input type="text" data-k="nombre1" value="JUAN RAFAEL"></label>
      <label>Nombre en la banda (línea 2) <input type="text" data-k="nombre2" value="CRUZ PÉREZ"></label>
      <label>Nombre completo <input type="text" data-k="nombre" value="Juan Rafael Cruz Pérez"></label>
      <label>Cargo <input type="text" data-k="cargo" value="Periodista y Reportero"></label>
      <label>Afiliación <input type="text" data-k="afiliacion" value="Prensa Digital"></label>
      <label>Código <input type="text" data-k="codigo" value="0007"></label>
      <label>Contenido del QR (enlace o texto) <input type="text" data-k="qr" value="ASOIPREDI - Carnet 0007 - Juan Rafael Cruz Pérez"></label>
    </fieldset>

    <div class="botones">
      <button type="button" id="btnFrente">⬇ PNG frente</button>
      <button type="button" id="btnReverso">⬇ PNG reverso</button>
      <button type="button" class="rojo" id="btnImprimir">🖨 Imprimir</button>
      <button type="button" class="gris" id="btnReset">Restablecer</button>
    </div>
  </form>

  <!-- ================= CARNETS ================= -->

<script>
(function () {
  const CLAVE = 'carnet-plantilla-v2';
  const W = 466, H = 1075;
  const form = document.getElementById('editor');
  const campos = [...form.querySelectorAll('[data-k]')];
  const defaults = Object.fromEntries(campos.map(c => [c.dataset.k, c.value]));
  const imagenes = { foto: null };

  function datos() { return Object.fromEntries(campos.map(c => [c.dataset.k, c.value])); }

  // Si un texto es más largo que su espacio, se estrecha para que quepa sin salirse de la banda
  function ajustar(el) {
    el.style.transform = '';
    const ancho = el.clientWidth, real = el.firstElementChild ? el.firstElementChild.offsetWidth : 0;
    if (real > ancho) el.style.transform = `scaleX(${(ancho / real).toFixed(3)})`;
  }

  function render() {
    const d = datos();
    document.querySelectorAll('[data-v]').forEach(el => {
      const s = document.createElement('span');
      s.textContent = d[el.dataset.v] ?? '';
      el.replaceChildren(s);
    });
    document.querySelectorAll('[data-ajuste]').forEach(ajustar);
    const foto = document.getElementById('foto');
    foto.innerHTML = imagenes.foto ? `<img alt="Foto" src="${imagenes.foto}">` : 'Sube una foto';

    const qrBox = document.getElementById('qr');
    qrBox.innerHTML = '';
    if (window.QRCode && d.qr) {
      new QRCode(qrBox, { text: d.qr, width: 240, height: 240, colorDark: '#0a1f5c', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    }
    guardar();
  }

  function guardar() {
    try { localStorage.setItem(CLAVE, JSON.stringify({ d: datos(), img: imagenes })); } catch (e) { /* sin espacio o bloqueado */ }
  }
  function cargar() {
    try {
      const g = JSON.parse(localStorage.getItem(CLAVE) || 'null');
      if (!g) return;
      campos.forEach(c => { if (g.d && c.dataset.k in g.d) c.value = g.d[c.dataset.k]; });
      if (g.img && g.img.foto) imagenes.foto = g.img.foto;
    } catch (e) { /* ignorar */ }
  }

  function leerImagen(input, clave, maxLado) {
    input.addEventListener('change', () => {
      const f = input.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        // Reducir la imagen para que quepa en el almacenamiento del navegador
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, maxLado / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          imagenes[clave] = c.toDataURL('image/jpeg', .9);
          render();
        };
        img.src = r.result;
      };
      r.readAsDataURL(f);
    });
  }

  async function descargar(id, nombre) {
    if (!window.html2canvas) { alert('No se pudo cargar la herramienta de descarga (revisa tu conexión a internet). Puedes usar "Imprimir" y guardar como PDF.'); return; }
    const card = document.getElementById(id);
    const prev = card.style.transform; card.style.transform = 'none';
    await document.fonts.ready;
    const canvas = await html2canvas(card, { scale: 3, backgroundColor: null, useCORS: true });
    card.style.transform = prev;
    const a = document.createElement('a');
    const cod = (datos().codigo || 'carnet').replace(/[^\w-]+/g, '');
    a.download = `carnet-${cod}-${nombre}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  // Ajustar el carnet al ancho de pantalla en móviles
  function escalar() {
    document.querySelectorAll('.escala').forEach(w => {
      const card = w.querySelector('.card');
      const k = Math.min(1, w.clientWidth / W);
      card.style.transform = k < 1 ? `scale(${k})` : '';
      w.style.height = (H * k) + 'px';
    });
  }

  cargar();
  campos.forEach(c => c.addEventListener('input', render));
  leerImagen(document.getElementById('inFoto'), 'foto', 900);
  document.getElementById('btnFrente').onclick = () => descargar('cardFrente', 'frente');
  document.getElementById('btnReverso').onclick = () => descargar('cardReverso', 'reverso');
  document.getElementById('btnImprimir').onclick = () => window.print();
  document.getElementById('btnReset').onclick = () => {
    if (!confirm('¿Restablecer todos los datos y la foto?')) return;
    campos.forEach(c => { c.value = defaults[c.dataset.k]; });
    imagenes.foto = null;
    form.querySelectorAll('input[type=file]').forEach(i => i.value = '');
    render();
  };
  window.addEventListener('resize', escalar);
  render();
  escalar();
  // Volver a medir los textos cuando terminen de cargar las fuentes
  if (document.fonts) document.fonts.ready.then(() => document.querySelectorAll('[data-ajuste]').forEach(ajustar));
})();
</script>
