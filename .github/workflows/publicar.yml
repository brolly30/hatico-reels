name: publicar
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python publicar.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          VIDEOS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add publicados.csv
          git diff --cached --quiet || (git commit -m "registro de publicaciones" && git push)
