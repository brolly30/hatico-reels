name: publicar
on:
  schedule:
    - cron: "7 */3 * * *"   # respaldo por si la cadena se corta
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: publicar
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
      - run: python -u publicar.py --bucle
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          VIDEOS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Relanzar
        run: gh workflow run publicar.yml -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
